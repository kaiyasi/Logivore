# Docker Compose Template with Auto-Restart Policies
# This template ensures containers restart automatically after system reboot

services:
  # Example web application
  webapp:
    image: nginx:latest
    container_name: webapp
    restart: unless-stopped  # Auto-restart unless manually stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
    environment:
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Example database
  database:
    image: mysql:8.0
    container_name: database
    restart: always  # Always restart (even if manually stopped)
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: your_database
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Example cache service
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

# Network configuration
networks:
  default:
    driver: bridge